      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <!-- Headset Arc -->
  <path d="M 16 32 C 16 20 23 12 32 12 C 41 12 48 20 48 32" fill="none" stroke="url(#headsetGrad)" stroke-width="4.5" stroke-linecap="round"/>
