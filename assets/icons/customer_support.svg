  <!-- Right Earpad -->
  <rect x="45" y="28" width="8" height="16" rx="4" fill="#fbbf24"/>
  <!-- Microphone Boom -->
  <path d="M 48 38 L 40 48 L 34 48" fill="none" stroke="url(#headsetGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="33" cy="48" r="3" fill="#d97706"/>
  <!-- 24/7 Badge Text -->
