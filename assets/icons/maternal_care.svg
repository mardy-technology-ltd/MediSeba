    <path d="M 25 14 C 25 9 39 9 39 14 C 39 18 41 22 41 24" fill="none" stroke="#4c1d95" stroke-width="3" stroke-linecap="round"/>
    <!-- Mother Body Armor/Dress -->
    <path d="M 22 48 C 22 32 26 24 32 24 C 38 24 42 32 42 48" fill="url(#motherPurple)" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Baby Head -->
    <circle cx="36" cy="32" r="4.5" fill="#fed7aa"/>
    <!-- Swaddled Baby in Pink -->
    <path d="M 32 42 C 32 37 36 36 40 39 C 42 41 40 45 35 45 Z" fill="#f43f5e"/>
    <!-- Pink Heart Symbol -->
    <path d="M 24 34 C 24 31 27 30 29 32 C 31 30 34 31 34 34 C 34 37 29 40 29 40 C 29 40 24 37 24 34 Z" fill="#ec4899"/>
  </g>
</svg>
