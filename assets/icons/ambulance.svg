<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ambulanceWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Red Siren Flash Light -->
    <rect x="25" y="14" width="6" height="4" rx="1.5" fill="#f43f5e"/>
    
    <!-- Ambulance Body -->
    <path d="M 8 22 L 38 22 L 48 30 L 56 30 C 58 30 59 32 59 34 L 59 46 L 8 46 Z" fill="url(#ambulanceWhite)" stroke="#e2e8f0" stroke-width="1.5"/>
    
    <!-- Blue Windshield -->
    <path d="M 39 25 L 46 31 L 39 31 Z" fill="#38bdf8"/>
    
    <!-- Medical Red Cross -->
    <path d="M 23 27 L 23 37 M 18 32 L 28 32" stroke="#e11d48" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Red Side Stripe -->
    <line x1="8" y1="39" x2="59" y2="39" stroke="#e11d48" stroke-width="2.5"/>
    
    <!-- Wheels -->
    <circle cx="18" cy="46" r="6" fill="#1e293b" stroke="#ffffff" stroke-width="1"/>
    <circle cx="18" cy="46" r="2.5" fill="#ffffff"/>
    <circle cx="47" cy="46" r="6" fill="#1e293b" stroke="#ffffff" stroke-width="1"/>
    <circle cx="47" cy="46" r="2.5" fill="#ffffff"/>
  </g>
</svg>
