<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Coral Red 3D Gradient matching Prototype -->
    <linearGradient id="redTagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b6e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g transform="rotate(-30 32 32)" filter="url(#dropShadow)">
    <!-- Hanging String / Ring -->
    <path d="M 20 8 C 20 2, 28 2, 28 8 L 28 14 L 20 14 Z" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    
    <!-- 3D Red Discount Tag Body -->
    <path d="M 14 14 L 36 14 L 54 32 C 56.5 34.5 56.5 38.5 54 41 L 41 54 C 38.5 56.5 34.5 56.5 32 54 L 14 36 Z" fill="url(#redTagGrad)" stroke="#ffffff" stroke-width="1.5"/>
    
    <!-- Tag Hole -->
    <circle cx="23" cy="23" r="4" fill="#1e293b"/>
    <circle cx="23" cy="23" r="2.5" fill="#ffffff"/>
    
    <!-- White Bold Percent % Symbol -->
    <text x="35" y="42" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="19" fill="#ffffff" text-anchor="middle">%</text>
  </g>
</svg>
