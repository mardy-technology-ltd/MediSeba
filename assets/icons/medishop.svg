<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="scooterGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="orangeBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Express Speed Motion Lines -->
    <line x1="2" y1="22" x2="8" y2="22" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="1" y1="28" x2="7" y2="28" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Orange Medicine Delivery Box -->
    <rect x="10" y="16" width="20" height="18" rx="4" fill="url(#orangeBox)" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M 20 20 L 20 30 M 15 25 L 25 25" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

    <!-- Scooter Body -->
    <path d="M 26 34 L 38 34 L 46 22 L 52 22" fill="none" stroke="url(#scooterGreen)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 18 42 L 48 42" stroke="url(#scooterGreen)" stroke-width="5" stroke-linecap="round"/>

    <!-- Wheels -->
    <circle cx="20" cy="46" r="6.5" fill="#1e293b" stroke="#ffffff" stroke-width="1"/>
    <circle cx="20" cy="46" r="2.5" fill="#ffffff"/>
    <circle cx="46" cy="46" r="6.5" fill="#1e293b" stroke="#ffffff" stroke-width="1"/>
    <circle cx="46" cy="46" r="2.5" fill="#ffffff"/>
  </g>
</svg>
